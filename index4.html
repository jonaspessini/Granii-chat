<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <!-- ✅ PRIMEIRO que qualquer coisa — previne flash -->
    <script src="js/page-transition.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="js/disable-zoom.js"></script>
    <meta name="theme-color" content="#21c45d">
    <title>Gerenciador de Contas</title>
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/remixicon/remixicon.css">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/index4.css">

</head>
<body>
    <div class="container">
        <button class="back-button" onclick="window.location.href='index2.html'">
            <svg viewBox="0 0 24 24">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
        </button>
        <h1>Gerenciador de Contas</h1>
        
        <div class="total-section">
            <div class="total-label">Saldo Total</div>
            <div class="total-value" id="totalValue">R$ 0,00</div>
        </div>

        <div class="accounts-list" id="accountsList">
            <div class="empty-state">Nenhuma conta cadastrada ainda</div>
        </div>
    </div>

    <!-- Botão Flutuante -->
    <button class="fab-button" onclick="openModal()">+</button>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Nova Conta</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="input-group">
                <label for="description">Descrição</label>
                <input type="text" id="description" placeholder="Ex: Salário, Conta de Luz...">
            </div>
            <div class="input-group">
                <label for="value">Valor (R$)</label>
                <input type="text" id="value" placeholder="0,00">
            </div>
            <button class="btn-save" onclick="saveAccount()">Salvar</button>
            <button class="btn-delete" id="deleteButton" onclick="deleteAccount()">Excluir Conta</button>
        </div>
    </div>

    <script>
        let accounts = [];
        let editingId = null;

        // Carregar dados do localStorage
        function loadFromStorage() {
            const saved = localStorage.getItem('bankAccounts');
            if (saved) {
                accounts = JSON.parse(saved);
            }
        }

        // Salvar dados no localStorage
        function saveToStorage() {
            localStorage.setItem('bankAccounts', JSON.stringify(accounts));
        }

        // Formatar número para moeda brasileira
        function formatCurrency(value) {
            return value.toLocaleString('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Formatar input enquanto digita
        function formatInputValue(input) {
            let value = input.value.replace(/\D/g, '');
            value = (parseInt(value) / 100).toFixed(2);
            
            if (value === '0.00') {
                input.value = '';
                return;
            }

            const parts = value.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            input.value = parts.join(',');
        }

        // Converter valor formatado para número
        function parseFormattedValue(formattedValue) {
            if (!formattedValue) return 0;
            return parseFloat(formattedValue.replace(/\./g, '').replace(',', '.'));
        }

        // Adicionar formatação ao input de valor
        document.getElementById('value').addEventListener('input', function(e) {
            formatInputValue(e.target);
        });

        function openModal() {
            document.getElementById('modal').classList.add('active');
            document.getElementById('description').focus();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('description').value = '';
            document.getElementById('value').value = '';
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Nova Conta';
            document.getElementById('deleteButton').style.display = 'none';
        }

        function saveAccount() {
            const desc = document.getElementById('description').value.trim();
            const valInput = document.getElementById('value').value;
            const val = parseFormattedValue(valInput);

            if (!desc || val === 0 || isNaN(val)) {
                alert('Por favor, preencha todos os campos corretamente!');
                return;
            }

            if (editingId !== null) {
                const idx = accounts.findIndex(a => a.id === editingId);
                accounts[idx] = { id: editingId, description: desc, value: val };
            } else {
                const account = {
                    id: Date.now(),
                    description: desc,
                    value: val
                };
                accounts.push(account);
            }

            saveToStorage();
            closeModal();
            renderAccounts();
        }

        function editAccount(id) {
            const account = accounts.find(a => a.id === id);
            document.getElementById('description').value = account.description;
            document.getElementById('value').value = formatCurrency(account.value);
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Editar Conta';
            document.getElementById('deleteButton').style.display = 'block';
            openModal();
        }

        function deleteAccount() {
            if (confirm('Tem certeza que deseja excluir esta conta?')) {
                accounts = accounts.filter(a => a.id !== editingId);
                saveToStorage();
                closeModal();
                renderAccounts();
            }
        }

        function renderAccounts() {
            const list = document.getElementById('accountsList');
            
            if (accounts.length === 0) {
                list.innerHTML = '<div class="empty-state">Nenhuma conta cadastrada ainda</div>';
                updateTotal();
                return;
            }

            list.innerHTML = accounts.map(acc => `
                <div class="account-item" onclick="editAccount(${acc.id})">
                    <div class="account-info">
                        <div class="account-description">${acc.description}</div>
                        <div class="account-value">R$ ${formatCurrency(acc.value)}</div>
                    </div>
                    <div class="account-actions">
                        <button class="btn-edit" onclick="event.stopPropagation(); editAccount(${acc.id})">Editar</button>
                    </div>
                </div>
            `).join('');

            updateTotal();
        }

        function updateTotal() {
            const total = accounts.reduce((sum, acc) => sum + acc.value, 0);
            document.getElementById('totalValue').textContent = 
                `R$ ${formatCurrency(total)}`;
        }

        // Fechar modal ao clicar fora
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Fechar modal com tecla ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Carregar dados ao iniciar
        loadFromStorage();
        renderAccounts();
    </script>
<script type="module">
  import { supabase } from './js/supabase-config.js';
  import { startSingleSessionGuard } from './js/single-session.js';

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
  } else {
    startSingleSessionGuard();
  }
</script>
<script>
  function fecharUpdateToast() {
    const toast = document.getElementById('appUpdateToast');
    const overlay = document.getElementById('appUpdateOverlay');
    if (!toast) return;
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s ease';
    if (overlay) { overlay.style.opacity = '0'; overlay.style.transition = 'opacity 0.3s ease'; }
    setTimeout(() => {
      toast.style.display = 'none'; toast.style.opacity = '1'; toast.style.transition = '';
      if (overlay) { overlay.style.display = 'none'; overlay.style.opacity = '1'; overlay.style.transition = ''; }
    }, 300);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });

    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'APP_UPDATED') {
        const toast = document.getElementById('appUpdateToast');
        const overlay = document.getElementById('appUpdateOverlay');
        const versionEl = document.getElementById('appUpdateVersion');
        if (!toast) return;
        const rawVersion = event.data.version || '';
        const match = rawVersion.match(/v[\d.]+/);
        if (versionEl) versionEl.textContent = match ? match[0] : '';
        if (overlay) overlay.style.display = 'block';
        toast.style.display = 'block';
      }
    });
  }
</script>

<!-- Overlay do popup de atualização -->
<div id="appUpdateOverlay" style="
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.55);
  z-index: 99998;
"></div>

<!-- Popup de atualização do app -->
<div id="appUpdateToast" style="
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translateX(-50%) translateY(-50%);
  background: #1e293b;
  color: #fff;
  padding: 18px 20px 14px;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  z-index: 99999;
  max-width: 320px;
  width: 90%;
  text-align: center;
  font-family: Inter, sans-serif;
  animation: slideUpToast 0.35s ease;
">
  <div style="font-size: 1.6em; margin-bottom: 6px;"><i class="ri-sparkling-line"></i></div>
  <div style="font-weight: 700; font-size: 1em; margin-bottom: 4px;">App atualizado!</div>
  <div id="appUpdateVersion" style="font-size: 0.78em; color: #21c45d; font-weight: 600; margin-bottom: 6px;"></div>
  <div style="font-size: 0.8em; color: #94a3b8; margin-bottom: 14px;">Uma nova versão foi instalada com sucesso.</div>
  <button onclick="fecharUpdateToast()" style="
    background: #21c45d;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 32px;
    font-size: 0.9em;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  ">OK</button>
</div>

<style>
@keyframes slideUpToast {
  from { opacity: 0; transform: translateX(-50%) translateY(-50%) scale(0.95); opacity: 0; }
  to   { opacity: 1; transform: translateX(-50%) translateY(-50%) scale(1); }
}
</style>
