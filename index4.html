<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <!-- ✅ PRIMEIRO que qualquer coisa — previne flash -->
    <script src="js/page-transition.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="js/disable-zoom.js"></script>
    <meta name="theme-color" content="#0f766e">
    <title>Metas</title>
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/remixicon/remixicon.css">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/index4.css">
    <style>
      .goals-page{max-width:680px;margin:0 auto;padding:28px 18px calc(160px + env(safe-area-inset-bottom));font-family:Inter,sans-serif;color:#172033;scroll-padding-bottom:calc(160px + env(safe-area-inset-bottom))}
      .goals-heading{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px}
      .goals-heading h1{font-size:26px;margin:0;background:#0f766e}.goals-heading p{margin:6px 0 0;color:#718096;font-size:14px}
      .goals-total{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 10px 28px #0f766e2b}
      .goals-total-label{font-size:13px;opacity:.85}.goals-total-value{font-size:26px;font-weight:700;margin-top:5px}
      .goals-list{display:grid;gap:14px}.goal-card{position:relative;background:#fff;border:1px solid #e7edf1;border-radius:18px;padding:18px;box-shadow:0 5px 18px #142a3b0a}
      .goal-card-top{display:flex;align-items:flex-start;gap:12px;padding-right:38px}.goal-icon{width:42px;height:42px;border-radius:14px;background:#e6fffb;color:#0f766e;display:grid;place-items:center;font-size:21px;flex:none}
      .goal-name{font-size:16px;font-weight:700;overflow-wrap:anywhere}.goal-deadline{font-size:12px;color:#718096;margin-top:4px}.goal-edit{position:absolute;right:14px;top:14px;border:0;background:#f1f5f9;color:#475569;border-radius:10px;width:34px;height:34px;font-size:17px}
      .goal-values{display:flex;justify-content:space-between;gap:10px;margin:18px 0 9px;font-size:13px;flex-wrap:wrap}.goal-saved{font-weight:700}.goal-target{color:#718096;text-align:right}.goal-percent{font-size:12px;font-weight:400;color:#718096;margin:7px 0 0;text-align:left}
      .goal-progress{height:9px;background:#e8eef0;border-radius:8px;overflow:hidden}.goal-progress-fill{height:100%;background:linear-gradient(90deg,#0f766e,#2dd4bf);border-radius:8px}
      .goal-monthly{background:#f0fdfa;border-radius:12px;padding:11px 13px;margin-top:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}.goal-monthly strong{color:#0f766e;font-size:15px}
      .goal-actions{display:flex;gap:9px;margin-top:14px}.goal-action{flex:1;border:0;border-radius:11px;padding:11px 8px;font-weight:700;font-size:13px}.goal-action.add{background:#0f766e;color:#fff}.goal-action.withdraw{background:#f1f5f9;color:#475569}
      .goal-history{margin-top:15px;border-top:1px solid #edf1f3;padding-top:12px}.goal-history-title{font-size:12px;font-weight:700;color:#64748b;margin-bottom:7px}.goal-history-list{display:grid;gap:7px;max-height:180px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:4px}.goal-history-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:#718096}.goal-history-kind{color:#475569}.goal-history-value{font-weight:600;white-space:nowrap}.goal-history-value.aporte{color:#0f766e}.goal-history-value.retirada{color:#b45309}.goal-history-empty{font-size:12px;color:#94a3b8}.goal-history-delete{flex:none;border:0;background:#fff1f2;color:#be123c;border-radius:8px;width:28px;height:28px}.goal-history-modal-panel .goal-history-list{max-height:55dvh}
      .goals-empty{text-align:center;padding:38px 18px;color:#718096;background:#fff;border:1px dashed #cbd5e1;border-radius:18px}.goals-empty i{display:block;font-size:36px;color:#0f766e;margin-bottom:10px}
      .goal-fab{position:fixed;right:max(20px,calc((100vw - 680px)/2 + 20px));bottom:calc(100px + env(safe-area-inset-bottom));width:56px;height:56px;border:0;border-radius:50%;background:#0f766e;color:#fff;font-size:28px;box-shadow:0 8px 20px #0f766e55;z-index:20}
      .goal-modal{display:none;position:fixed;inset:0;background:#0f172a80;z-index:1000;align-items:center;justify-content:center;padding:18px}.goal-modal.active{display:flex}
      .goal-modal-panel{width:100%;max-width:480px;max-height:90vh;max-height:calc(100dvh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 14px 40px #0003}.goal-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.goal-modal-head h2{margin:0;font-size:20px}.goal-modal-close{border:0;background:#f1f5f9;border-radius:50%;width:34px;height:34px;font-size:22px;color:#475569}
      .goal-alert-panel{max-width:380px;text-align:center}.goal-alert-icon{width:48px;height:48px;margin:0 auto 13px;border-radius:16px;background:#ccfbf1;color:#0f766e;display:grid;place-items:center;font-size:23px}.goal-alert-title{font-size:19px;font-weight:700;color:#172033}.goal-alert-message{font-size:14px;line-height:1.5;color:#64748b;margin:9px 0 20px;white-space:pre-line}.goal-alert-actions{display:flex;gap:10px}.goal-alert-actions button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:700}.goal-alert-cancel{background:#f1f5f9;color:#475569}.goal-alert-confirm{background:#0f766e;color:#fff}.goal-alert-confirm.danger{background:#be123c}
      .goal-field{margin-bottom:15px}.goal-field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}.goal-field input{width:100%;box-sizing:border-box;border:1px solid #d7e0e5;border-radius:11px;padding:13px;font:inherit;font-size:16px;color:#172033}.goal-form-actions{display:flex;gap:10px;margin-top:20px}.goal-form-actions button{flex:1;border:0;border-radius:11px;padding:13px;font-weight:700}.goal-cancel{background:#f1f5f9;color:#475569}.goal-save{background:#0f766e;color:#fff}.goal-delete{width:100%;border:0;background:#fff1f2;color:#be123c;padding:12px;border-radius:11px;font-weight:700;margin-top:10px}
      body.goals-screen{padding-bottom:calc(100px + env(safe-area-inset-bottom)) !important}
      body.goals-screen .bottom-nav{bottom:env(safe-area-inset-bottom)}
    </style>

</head>
<body class="goals-screen">
    <main class="goals-page">
      <header class="goals-heading"><div><h1>Minhas metas</h1><p>Planeje seus próximos objetivos</p></div></header>
      <section class="goals-total"><div class="goals-total-label">Total guardado nas metas</div><div class="goals-total-value" id="goalsTotalSaved">R$ 0,00</div></section>
      <section class="goals-list" id="goalsList"></section>
    </main>
    <button class="goal-fab" type="button" onclick="abrirModalMeta()" aria-label="Criar meta">+</button>

    <div class="goal-modal" id="goalModal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle">
      <div class="goal-modal-panel">
        <div class="goal-modal-head"><h2 id="goalModalTitle">Nova meta</h2><button class="goal-modal-close" type="button" onclick="fecharModalMeta()" aria-label="Fechar">&times;</button></div>
        <div class="goal-field"><label for="goalName">Nome da meta</label><input id="goalName" type="text" maxlength="80" placeholder="Ex.: Viagem, reserva de emergência"></div>
        <div class="goal-field"><label for="goalTarget">Valor desejado (R$)</label><input id="goalTarget" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="10000,00"></div>
        <div class="goal-field"><label for="goalDeadline">Data para concluir (opcional)</label><input id="goalDeadline" type="date"></div>
        <div class="goal-form-actions"><button class="goal-cancel" type="button" onclick="fecharModalMeta()">Cancelar</button><button class="goal-save" type="button" onclick="salvarMeta()">Salvar meta</button></div>
        <button class="goal-delete" id="goalDeleteButton" type="button" onclick="excluirMeta()" style="display:none">Excluir meta</button>
      </div>
    </div>
    <div class="goal-modal" id="movementModal" role="dialog" aria-modal="true" aria-labelledby="movementTitle">
      <div class="goal-modal-panel">
        <div class="goal-modal-head"><h2 id="movementTitle">Aporte</h2><button class="goal-modal-close" type="button" onclick="fecharModalMovimentacao()" aria-label="Fechar">&times;</button></div>
        <div class="goal-field"><label for="movementValue">Valor (R$)</label><input id="movementValue" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00"></div>
        <div class="goal-field"><label for="movementDate">Data do lançamento</label><input id="movementDate" type="date"></div>
        <div class="goal-form-actions"><button class="goal-cancel" type="button" onclick="fecharModalMovimentacao()">Cancelar</button><button class="goal-save" type="button" id="movementSaveButton" onclick="salvarMovimentacao()">Confirmar aporte</button></div>
        <div class="goal-history" id="movementHistory"></div>
      </div>
    </div>
    <div class="goal-modal" id="goalHistoryModal" role="dialog" aria-modal="true" aria-labelledby="goalHistoryTitle">
      <div class="goal-modal-panel goal-history-modal-panel">
        <div class="goal-modal-head"><h2 id="goalHistoryTitle">Histórico da meta</h2><button class="goal-modal-close" type="button" onclick="fecharHistoricoMeta()" aria-label="Fechar">&times;</button></div>
        <div class="goal-history" id="goalHistoryContent"></div>
      </div>
    </div>
    <div class="goal-modal" id="goalNoticeModal" role="alertdialog" aria-modal="true" aria-labelledby="goalNoticeTitle" aria-describedby="goalNoticeMessage">
      <div class="goal-modal-panel goal-alert-panel">
        <div class="goal-alert-icon"><i class="ri-information-line"></i></div>
        <div class="goal-alert-title" id="goalNoticeTitle">Aviso</div>
        <div class="goal-alert-message" id="goalNoticeMessage"></div>
        <div class="goal-alert-actions"><button class="goal-alert-cancel" id="goalNoticeCancel" type="button" onclick="resolverDialogoMeta(false)">Cancelar</button><button class="goal-alert-confirm" id="goalNoticeConfirm" type="button" onclick="resolverDialogoMeta(true)">Entendi</button></div>
      </div>
    </div>

    <script>
      const GOALS_STORAGE_KEY = 'metas_financeiras';
      let metas = [];
      let metaEditandoId = null;
      let metaMovimentacaoId = null;
      let metaHistoricoExpandidoId = null;
      let resolverAvisoMeta = null;
      let tipoMovimentacao = 'aporte';
      const moedaMeta = valor => Number(valor || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const escaparMeta = texto => String(texto || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function salvarMetasStorage() { localStorage.setItem(GOALS_STORAGE_KEY, JSON.stringify(metas)); }
      function abrirDialogoMeta(titulo, mensagem, confirmar = false, perigo = false) {
        document.getElementById('goalNoticeTitle').textContent = titulo;
        document.getElementById('goalNoticeMessage').textContent = mensagem;
        document.getElementById('goalNoticeCancel').style.display = confirmar ? '' : 'none';
        const botao = document.getElementById('goalNoticeConfirm');
        botao.textContent = confirmar ? 'Confirmar' : 'Entendi';
        botao.classList.toggle('danger', perigo);
        document.getElementById('goalNoticeModal').classList.add('active');
        return new Promise(resolve => { resolverAvisoMeta = resolve; });
      }
      function resolverDialogoMeta(resultado) {
        document.getElementById('goalNoticeModal').classList.remove('active');
        if (resolverAvisoMeta) resolverAvisoMeta(resultado);
        resolverAvisoMeta = null;
      }
      function mostrarAvisoMeta(mensagem, titulo = 'Atenção') { return abrirDialogoMeta(titulo, mensagem); }
      function confirmarAcaoMeta(mensagem, titulo = 'Confirmar exclusão') { return abrirDialogoMeta(titulo, mensagem, true, true); }
      function mesesAteMeta(dataFim) {
        if (!dataFim) return null;
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const fim = new Date(`${dataFim}T00:00:00`);
        return Math.max(1, (fim.getFullYear() - hoje.getFullYear()) * 12 + fim.getMonth() - hoje.getMonth() + (fim.getDate() >= hoje.getDate() ? 1 : 0));
      }
      function dataMetaBR(data) { return data ? new Date(`${data}T00:00:00`).toLocaleDateString('pt-BR') : 'Sem prazo definido'; }
      function criarHistoricoMetaHTML(meta, incluirExcluir = false) {
        const movimentos = Array.isArray(meta?.movimentos) ? meta.movimentos.map((mov, indice) => ({ ...mov, indiceOriginal: indice })).sort((a, b) => String(b.data || '').slice(0, 10).localeCompare(String(a.data || '').slice(0, 10))) : [];
        const linhas = movimentos.length
          ? movimentos.map(mov => {
              const ehAporte = mov.tipo === 'aporte';
              const dataMov = String(mov.data || '').slice(0, 10);
              return `<div class="goal-history-row"><span><span class="goal-history-kind">${ehAporte ? 'Aporte' : 'Retirada'}</span> · ${dataMetaBR(dataMov)}</span><span class="goal-history-value ${ehAporte ? 'aporte' : 'retirada'}">${ehAporte ? '+' : '−'} R$ ${moedaMeta(mov.valor)}</span>${incluirExcluir ? `<button class="goal-history-delete" type="button" onclick="event.stopPropagation(); excluirMovimentacao('${meta.id}',${mov.indiceOriginal})" aria-label="Excluir movimentação"><i class="ri-delete-bin-line"></i></button>` : ''}</div>`;
            }).join('')
          : '<div class="goal-history-empty">Nenhuma movimentação registrada</div>';
        return `<div class="goal-history-title">Histórico de ${escaparMeta(meta?.nome || 'meta')}</div><div class="goal-history-list">${linhas}</div>`;
      }
      function renderizarMetas() {
        const lista = document.getElementById('goalsList');
        const total = metas.reduce((soma, meta) => soma + Number(meta.guardado || 0), 0);
        document.getElementById('goalsTotalSaved').textContent = `R$ ${moedaMeta(total)}`;
        if (!metas.length) { lista.innerHTML = '<div class="goals-empty"><i class="ri-flag-2-line"></i><strong>Nenhuma meta cadastrada</strong><div style="margin-top:6px;font-size:13px">Toque no + para criar seu primeiro objetivo.</div></div>'; return; }
        lista.innerHTML = metas.map(meta => {
          const guardado = Number(meta.guardado || 0), alvo = Number(meta.alvo || 0);
          const percentual = alvo > 0 ? Math.min(100, Math.max(0, guardado / alvo * 100)) : 0;
          const mesesRestantes = mesesAteMeta(meta.dataFim);
          const mensal = percentual >= 100 ? 0 : (mesesRestantes ? Math.max(0, alvo - guardado) / mesesRestantes : null);
          return `<article class="goal-card" onclick="abrirHistoricoMeta('${meta.id}')" style="cursor:pointer">
            <button class="goal-edit" type="button" onclick="event.stopPropagation(); editarMeta('${meta.id}')" aria-label="Editar meta"><i class="ri-pencil-line"></i></button>
            <div class="goal-card-top"><div class="goal-icon"><i class="ri-flag-2-line"></i></div><div><div class="goal-name">${escaparMeta(meta.nome)}</div><div class="goal-deadline">Até ${dataMetaBR(meta.dataFim)}</div></div></div>
            <div class="goal-values"><span class="goal-saved">R$ ${moedaMeta(guardado)} guardados</span><span class="goal-target">de R$ ${moedaMeta(alvo)}</span></div>
            <div class="goal-progress"><div class="goal-progress-fill" style="width:${percentual}%"></div></div>
            <div class="goal-percent">${percentual.toFixed(0)}% concluído</div>
            <div class="goal-monthly"><span>${percentual >= 100 ? 'Meta concluída!' : (mesesRestantes ? `Aplique por mês · ${mesesRestantes} ${mesesRestantes === 1 ? 'mês' : 'meses'}` : 'Defina uma data para calcular o valor mensal')}</span><strong>${mensal === null ? '—' : `R$ ${moedaMeta(mensal)}`}</strong></div>
            <div class="goal-actions"><button class="goal-action add" type="button" onclick="event.stopPropagation(); abrirMovimentacao('${meta.id}','aporte')"><i class="ri-add-line"></i> Aporte</button><button class="goal-action withdraw" type="button" onclick="event.stopPropagation(); abrirMovimentacao('${meta.id}','retirada')"><i class="ri-subtract-line"></i> Retirada</button></div>
          </article>`;
        }).join('');
      }
      function abrirModalMeta(id = null) {
        metaEditandoId = id;
        const meta = id ? metas.find(item => item.id === id) : null;
        document.getElementById('goalModalTitle').textContent = meta ? 'Editar meta' : 'Nova meta';
        document.getElementById('goalName').value = meta?.nome || '';
        document.getElementById('goalTarget').value = meta?.alvo ?? '';
        document.getElementById('goalDeadline').value = meta?.dataFim || '';
        document.getElementById('goalDeleteButton').style.display = meta ? 'block' : 'none';
        document.getElementById('goalModal').classList.add('active');
      }
      function editarMeta(id) { abrirModalMeta(id); }
      function atualizarPopupHistoricoMeta(id) {
        const meta = metas.find(item => item.id === id);
        if (!meta) { fecharHistoricoMeta(); return; }
        document.getElementById('goalHistoryTitle').textContent = `Histórico · ${meta.nome}`;
        document.getElementById('goalHistoryContent').innerHTML = criarHistoricoMetaHTML(meta, true);
      }
      function abrirHistoricoMeta(id) {
        metaHistoricoExpandidoId = id;
        atualizarPopupHistoricoMeta(id);
        document.getElementById('goalHistoryModal').classList.add('active');
      }
      function fecharHistoricoMeta() {
        document.getElementById('goalHistoryModal').classList.remove('active');
        metaHistoricoExpandidoId = null;
      }
      function fecharModalMeta() { document.getElementById('goalModal').classList.remove('active'); metaEditandoId = null; }
      async function salvarMeta() {
        const nome = document.getElementById('goalName').value.trim();
        const alvo = Number(document.getElementById('goalTarget').value);
        const dataFim = document.getElementById('goalDeadline').value;
        if (!nome || !Number.isFinite(alvo) || alvo <= 0) { await mostrarAvisoMeta('Preencha o nome e o valor desejado.'); return; }
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        if (dataFim && new Date(`${dataFim}T00:00:00`) < hoje) { await mostrarAvisoMeta('A data final precisa ser hoje ou uma data futura.'); return; }
        if (metaEditandoId) {
          const index = metas.findIndex(item => item.id === metaEditandoId);
          metas[index] = { ...metas[index], nome, alvo, dataFim };
        } else metas.push({ id: `meta_${Date.now()}_${Math.random().toString(36).slice(2,7)}`, nome, alvo, dataFim, guardado: 0, movimentos: [] });
        salvarMetasStorage(); fecharModalMeta(); renderizarMetas();
      }
      async function excluirMeta() {
        if (!metaEditandoId || !await confirmarAcaoMeta('Excluir esta meta e o histórico de aportes e retiradas?')) return;
        metas = metas.filter(item => item.id !== metaEditandoId); salvarMetasStorage(); fecharModalMeta(); renderizarMetas();
      }
      function abrirMovimentacao(id, tipo) {
        metaMovimentacaoId = id; tipoMovimentacao = tipo;
        document.getElementById('movementTitle').textContent = tipo === 'aporte' ? 'Aporte na meta' : 'Retirada da meta';
        document.getElementById('movementSaveButton').textContent = tipo === 'aporte' ? 'Confirmar aporte' : 'Confirmar retirada';
        document.getElementById('movementValue').value = '';
        const hoje = new Date();
        document.getElementById('movementDate').value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
        const meta = metas.find(item => item.id === id);
        document.getElementById('movementHistory').innerHTML = criarHistoricoMetaHTML(meta);
        document.getElementById('movementModal').classList.add('active');
      }
      function fecharModalMovimentacao() { document.getElementById('movementModal').classList.remove('active'); metaMovimentacaoId = null; }
      async function salvarMovimentacao() {
        const valor = Number(document.getElementById('movementValue').value);
        const dataMovimento = document.getElementById('movementDate').value;
        const meta = metas.find(item => item.id === metaMovimentacaoId);
        if (!meta || !Number.isFinite(valor) || valor <= 0 || !dataMovimento) { await mostrarAvisoMeta('Informe um valor maior que zero e a data do lançamento.'); return; }
        const saldoAtual = Number(meta.guardado || 0);
        if (tipoMovimentacao === 'retirada' && valor > saldoAtual) { await mostrarAvisoMeta('A retirada não pode ser maior que o valor guardado.'); return; }
        meta.guardado = Math.round((saldoAtual + (tipoMovimentacao === 'aporte' ? valor : -valor)) * 100) / 100;
        meta.movimentos = Array.isArray(meta.movimentos) ? meta.movimentos : [];
        meta.movimentos.push({ tipo: tipoMovimentacao, valor, data: dataMovimento });
        salvarMetasStorage(); fecharModalMovimentacao(); renderizarMetas();
      }
      async function excluirMovimentacao(metaId, indiceMovimento) {
        const meta = metas.find(item => item.id === metaId);
        const movimento = meta?.movimentos?.[indiceMovimento];
        if (!meta || !movimento) return;
        const valor = Number(movimento.valor) || 0;
        if (!await confirmarAcaoMeta(`Excluir este ${movimento.tipo === 'aporte' ? 'aporte' : 'retirada'} de R$ ${moedaMeta(valor)}?`)) return;
        const saldoAtual = Number(meta.guardado || 0);
        if (movimento.tipo === 'aporte' && saldoAtual - valor < -0.005) {
          await mostrarAvisoMeta('Não é possível excluir este aporte porque parte dele já foi usada em retiradas. Exclua primeiro as retiradas relacionadas.');
          return;
        }
        meta.guardado = Math.round((saldoAtual + (movimento.tipo === 'aporte' ? -valor : valor)) * 100) / 100;
        meta.movimentos.splice(indiceMovimento, 1);
        salvarMetasStorage();
        renderizarMetas();
        if (metaHistoricoExpandidoId === metaId) atualizarPopupHistoricoMeta(metaId);
      }
      document.querySelectorAll('.goal-modal').forEach(modal => modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('active'); }));
      document.getElementById('goalNoticeModal').addEventListener('click', e => { if (e.target === e.currentTarget) resolverDialogoMeta(false); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.getElementById('goalNoticeModal').classList.contains('active')) resolverDialogoMeta(false); document.querySelectorAll('.goal-modal.active').forEach(modal => { if (modal.id !== 'goalNoticeModal') modal.classList.remove('active'); }); } });
      try { metas = JSON.parse(localStorage.getItem(GOALS_STORAGE_KEY) || '[]'); if (!Array.isArray(metas)) metas = []; } catch (_) { metas = []; }
      renderizarMetas();
    </script>
<script type="module">
  import { supabase } from './js/supabase-config.js';
  import { startSingleSessionGuard } from './js/single-session.js';

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
  } else {
    startSingleSessionGuard();
  }
</script>
<script>
  function fecharUpdateToast() {
    const toast = document.getElementById('appUpdateToast');
    const overlay = document.getElementById('appUpdateOverlay');
    if (!toast) return;
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s ease';
    if (overlay) { overlay.style.opacity = '0'; overlay.style.transition = 'opacity 0.3s ease'; }
    setTimeout(() => {
      toast.style.display = 'none'; toast.style.opacity = '1'; toast.style.transition = '';
      if (overlay) { overlay.style.display = 'none'; overlay.style.opacity = '1'; overlay.style.transition = ''; }
    }, 300);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });

    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'APP_UPDATED') {
        const toast = document.getElementById('appUpdateToast');
        const overlay = document.getElementById('appUpdateOverlay');
        const versionEl = document.getElementById('appUpdateVersion');
        if (!toast) return;
        const rawVersion = event.data.version || '';
        const match = rawVersion.match(/v[\d.]+/);
        if (versionEl) versionEl.textContent = match ? match[0] : '';
        if (overlay) overlay.style.display = 'block';
        toast.style.display = 'block';
      }
    });
  }
</script>

<!-- Overlay do popup de atualização -->
<div id="appUpdateOverlay" style="
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.55);
  z-index: 99998;
"></div>

<!-- Popup de atualização do app -->
<div id="appUpdateToast" style="
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translateX(-50%) translateY(-50%);
  background: #1e293b;
  color: #fff;
  padding: 18px 20px 14px;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  z-index: 99999;
  max-width: 320px;
  width: 90%;
  text-align: center;
  font-family: Inter, sans-serif;
  animation: slideUpToast 0.35s ease;
">
  <div style="font-size: 1.6em; margin-bottom: 6px;"><i class="ri-sparkling-line"></i></div>
  <div style="font-weight: 700; font-size: 1em; margin-bottom: 4px;">App atualizado!</div>
  <div id="appUpdateVersion" style="font-size: 0.78em; color: #21c45d; font-weight: 600; margin-bottom: 6px;"></div>
  <div style="font-size: 0.8em; color: #94a3b8; margin-bottom: 14px;">Uma nova versão foi instalada com sucesso.</div>
  <button onclick="fecharUpdateToast()" style="
    background: #21c45d;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 32px;
    font-size: 0.9em;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  ">OK</button>
</div>

<style>
@keyframes slideUpToast {
  from { opacity: 0; transform: translateX(-50%) translateY(-50%) scale(0.95); opacity: 0; }
  to   { opacity: 1; transform: translateX(-50%) translateY(-50%) scale(1); }
}
</style>
