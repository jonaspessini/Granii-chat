<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gastos Mensal — Apresentação</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101513;color:#fff;font:15px Inter,Arial,sans-serif;display:grid;place-items:center}.stage{width:min(92vw,390px);text-align:center}.frame{position:relative;width:100%;aspect-ratio:9/16;border-radius:24px;overflow:hidden;box-shadow:0 24px 90px #0009;background:#f7faf7}canvas{display:block;width:100%;height:100%}.controls{display:flex;gap:10px;justify-content:center;margin-top:16px}.controls button{border:0;border-radius:99px;padding:12px 18px;font-weight:700;background:#21c45d;color:#082510;cursor:pointer}.controls button.secondary{background:#26312b;color:#fff}small{display:block;color:#aab4ad;margin-top:10px}
</style></head><body><main class="stage"><div class="frame"><canvas id="c" width="1080" height="1920"></canvas></div><div class="controls"><button id="play">▶ Reproduzir</button><button class="secondary" id="save">↓ Baixar vídeo</button></div><small>Apresentação vertical · 24 segundos · 1080 × 1920</small></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),W=1080,H=1920,G='#21c45d',D='#f7faf7',INK='#17211b',MUT='#7d8980',RED='#f05b5b';let start=performance.now(),recording=false,rec,chunks=[];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=clamp(t);return t*t*(3-2*t)},fmt='R$';
function rr(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}}
function txt(s,a,b,size=36,color=INK,weight=500,align='left'){x.font=`${weight} ${size}px Inter,Arial`;x.fillStyle=color;x.textAlign=align;x.fillText(s,a,b)}
function line(a,b,d,e,color='#e6ece7',width=2){x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=color;x.lineWidth=width;x.stroke()}
function base(t){x.fillStyle=D;x.fillRect(0,0,W,H);x.fillStyle='#eff7f0';x.beginPath();x.arc(930,200,270,0,7);x.fill();x.fillStyle=G;x.beginPath();x.arc(100,1770,210,0,7);x.fill();x.fillStyle='#e8f5eb';x.beginPath();x.arc(30,1690,120,0,7);x.fill();x.fillStyle='#101813';x.fillRect(0,0,W,14);txt('GASTOS MENSAL',72,105,26,INK,700);rr(897,58,110,50,25,'#e6f5e9');txt('FINANÇAS',952,91,17,'#17833c',700,'center')}
function header(kicker,title,sub,t){txt(kicker.toUpperCase(),72,255,22,'#18883f',700);let y=340;title.forEach((s,i)=>txt(s,72,y+i*86,68,INK,700));txt(sub,72,y+title.length*86+18,28,MUT,400);}
function screenPhone(y,scale=1){x.save();x.translate(540,y);x.scale(scale,scale);x.translate(-420,-560);rr(0,0,840,1120,70,'#17221b');rr(16,16,808,1088,56,'#f7faf7');rr(355,24,130,18,9,'#17221b');x.restore()}
function scene0(q){base(q);x.fillStyle=G;x.beginPath();x.arc(540,700,145,0,Math.PI*2);x.fill();txt('↗',540,755,150,'#fff',700,'center');txt('GASTOS',540,1015,84,INK,700,'center');txt('MENSAL',540,1100,84,INK,700,'center');txt('Seu dinheiro, no controle.',540,1200,34,MUT,400,'center');rr(380,1340,320*ease(q),8,4,G);}
function scene1(q){base(q);header('Tudo em um só lugar',['Clareza para','decidir melhor'],'Acompanhe sua vida financeira.',q);screenPhone(720,.82);let p=ease((q-.12)/.7);rr(130,790,820,420,34,'#fff','#e8eee9');txt('Saldo atual',185,870,27,MUT);txt('R$ 8.450,00',185,970,70,INK,700);rr(185,1030,710*p,12,6,G);txt('↑  Receitas',185,1125,25,'#18883f',600);txt('↓  Despesas',540,1125,25,RED,600);rr(165,1450,750,130,26,'#e7f7ea');txt('Seu mês em perspectiva',210,1530,30,INK,600);txt('simples, rápido e visual',210,1575,23,MUT);}
function scene2(q){base(q);header('Visão mensal',['Receitas e gastos,','lado a lado'],'Entenda o ritmo do seu mês.',q);screenPhone(720,.82);rr(130,790,820,575,34,'#fff','#e8eee9');txt('Resumo do mês',185,870,28,MUT,600);txt('R$ 2.180,00',185,960,58,INK,700);txt('saldo positivo',185,1008,24,'#18883f',600);line(185,1060,890,1060);let vals=[.26,.38,.32,.56,.48,.7,.62,.82,.75,.93];for(let i=0;i<vals.length;i++){let xx=210+i*66,h=200*vals[i]*ease((q-i*.025)/.45);rr(xx,1300-h,28,h,14,i%3===0?G:'#a6e3b5');}txt('JAN       FEV       MAR       ABR       MAI',200,1330,18,MUT);rr(130,1410,820,160,30,'#fff');txt('Gastos por categoria',180,1480,28,INK,600);txt('Casa  ·  Mercado  ·  Transporte',180,1525,22,MUT);}
function scene3(q){base(q);header('Organização inteligente',['Cada gasto','no seu lugar'],'Categorias que mostram o que importa.',q);screenPhone(720,.82);rr(130,790,820,670,34,'#fff','#e8eee9');txt('Gastos por categoria',185,870,29,INK,600);let cats=[['Casa',.72,G],['Mercado',.54,'#77d995'],['Transporte',.38,'#abdcb8'],['Lazer',.22,'#d2e9d8']];cats.forEach((a,i)=>{let yy=980+i*115;txt(a[0],185,yy,25,INK,500);txt(['R$ 1.240','R$ 680','R$ 420','R$ 260'][i],890,yy,24,MUT,500,'right');rr(185,yy+20,700,14,7,'#edf1ed');rr(185,yy+20,700*a[1]*ease((q-i*.07)/.4),14,7,a[2]);});rr(130,1490,820,120,28,'#e7f7ea');txt('Mais consciência. Menos surpresa.',540,1560,28,'#157f39',600,'center');}
function scene4(q){base(q);header('Seu dia a dia',['Controle na','ponta dos dedos'],'Lançamentos e vencimentos organizados.',q);screenPhone(720,.82);rr(130,790,820,600,34,'#fff','#e8eee9');txt('Últimos lançamentos',185,870,29,INK,600);let rows=[['Mercado','Hoje · Alimentação','− R$ 186,40',RED],['Salário','Hoje · Receita','+ R$ 4.800,00',G],['Internet','Amanhã · Contas','− R$ 99,90',RED]];rows.forEach((r,i)=>{let yy=980+i*145;x.fillStyle=i===1?'#e4f6e9':'#f0f4f0';x.beginPath();x.arc(215,yy-8,32,0,7);x.fill();txt(i===0?'⌂':i===1?'↑':'◷',215,yy+2,27,i===1?'#17883c':'#68746b',700,'center');txt(r[0],275,yy-8,25,INK,600);txt(r[1],275,yy+30,19,MUT);txt(r[2],890,yy,23,r[3],600,'right');if(i<2)line(185,yy+66,890,yy+66);});rr(185,1350,700,72,36,G);txt('Tudo organizado em um só app',535,1396,24,'#fff',700,'center');}
function scene5(q){x.fillStyle='#122018';x.fillRect(0,0,W,H);x.fillStyle='#193b26';x.beginPath();x.arc(540,740,430,0,7);x.fill();x.fillStyle=G;x.beginPath();x.arc(540,720,140,0,7);x.fill();txt('✓',540,780,140,'#fff',700,'center');txt('GASTOS MENSAL',540,1040,68,'#fff',700,'center');txt('Seu dinheiro. Suas escolhas.',540,1130,30,'#b9d8c0',400,'center');rr(200,1270,680,100,50,G);txt('Comece a organizar',540,1335,30,'#092310',700,'center');txt('CONTROLE • CLAREZA • TRANQUILIDADE',540,1495,20,'#aacbb2',600,'center');}
const scenes=[scene0,scene1,scene2,scene3,scene4,scene5],dur=[3.5,4.2,4.2,4.2,4.2,3.7],total=dur.reduce((a,b)=>a+b,0);
function draw(now){let elapsed=((now-start)/1000)%total,acc=0,i=0;for(;i<dur.length-1&&elapsed>acc+dur[i];i++)acc+=dur[i];let q=clamp((elapsed-acc)/dur[i]);x.save();let intro=ease(clamp(q*4));x.globalAlpha=intro;scenes[i](q);x.restore();if(recording&&rec?.state==='recording'&&(now-start)/1000>=total){rec.stop();recording=false}requestAnimationFrame(draw)}
document.querySelector('#play').onclick=()=>{start=performance.now();};
document.querySelector('#save').onclick=()=>{if(!window.MediaRecorder){alert('Seu navegador não oferece gravação de vídeo.');return}start=performance.now();chunks=[];let stream=c.captureStream(30);let mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6500000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:mime});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gastos-mensal-apresentacao.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);document.querySelector('#save').textContent='↓ Baixar vídeo novamente'};rec.start();recording=true;document.querySelector('#save').textContent='Gravando… 24 s';};requestAnimationFrame(draw);
</script></body></html>
